name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Normally 2 to 8 minutes. Without a limit, a hung test runs to GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  lsp:
    # The LSP tier against real, pinned language servers (test/lsp-servers/). The check job has
    # none, so there these suites skip; here BCR_LSP_REQUIRED makes a missing server a failure.
    name: language-server integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/lsp-servers/*/package-lock.json
      - run: npm ci
      - run: npm run test:lsp

  licenses:
    name: dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run licenses
      - uses: actions/upload-artifact@v7
        with:
          name: THIRD_PARTY_NOTICES
          path: THIRD_PARTY_NOTICES
